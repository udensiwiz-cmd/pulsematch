<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-500 via-purple-600 to-indigo-700 h-screen flex flex-col justify-between text-white font-sans overflow-hidden">
    <header class="p-4 text-center border-b border-white/10 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider">❤️ PulseMatch</h1>
        <span id="username" class="text-xs bg-white/20 px-2 py-1 rounded-full">Loading...</span>
    </header>
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-xs bg-white text-gray-900 rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[420px]">
            <div class="h-3/4 bg-gray-300 flex items-center justify-center">
                <span class="text-6xl font-bold text-gray-500">?</span>
            </div>
            <div class="p-4 flex flex-col justify-center flex-1 bg-white">
                <h2 id="profile-name" class="text-2xl font-bold">Discovering...</h2>
                <p id="profile-bio" class="text-sm text-gray-500 mt-1">Finding matches near you...</p>
            </div>
        </div>
    </main>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').innerText = `@${user.username || user.first_name}`;
        } else {
            document.getElementById('username').innerText = "@TestUser";
        }
    </script>
</body>
</html>
